services:
  analytics:
    build:
      context: .
      dockerfile: Dockerfile
    image: banknote-analytics:local
    ports:
      - "3001:3001"
    env_file:
      - banknote-analytics-dashboard/.env
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: 0.0.0.0
      SQL_ROOT: /sql
      # Override file paths from .env (those point at ../secrets on the host)
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/banknote-sa.json
      COINZY_GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/coinzy-sa.json
    volumes:
      - ./secrets/bigquery-metabase-sa.json:/app/secrets/banknote-sa.json:ro
      - ./secrets/coinzy-analytics-dashboard-sa.json:/app/secrets/coinzy-sa.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 25s
